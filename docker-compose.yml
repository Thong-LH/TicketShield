version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketshield_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketshield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - ticketshield_network

networks:
  ticketshield_network:
    driver: bridge

volumes:
  postgres_data:
