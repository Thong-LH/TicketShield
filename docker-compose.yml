version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketshield_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketshield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - ticketshield_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ticketshield_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ticketshield_network

networks:
  ticketshield_network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
