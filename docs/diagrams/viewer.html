<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketShield AI - Architecture Studio & Masterclass</title>
  <script src="./marked.min.js"></script>
  <script src="./mermaid.min.js"></script>
  <style>
    :root {
      --bg-dark: #07090E;
      --card-bg: #0D1117;
      --sidebar-bg: #090C10;
      --border-color: rgba(255, 255, 255, 0.1);
      --accent: #FF5A36;
      --accent-glow: rgba(255, 90, 54, 0.25);
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --code-bg: #161B22;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header Bar */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 10;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #FF5A36, #FF8A00);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      color: white;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: white;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
    }

    /* Tab Controls */
    .tabs {
      display: flex;
      background: #05070A;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      color: #FFFFFF;
      background: var(--code-bg);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Action Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      background: #111620;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover {
      color: var(--text-main);
      background: #1B2230;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .ctrl-btn.active-toggle {
      color: #FF8A00;
      border-color: rgba(255, 138, 0, 0.4);
      background: rgba(255, 138, 0, 0.1);
    }

    .ctrl-btn.highlight {
      background: linear-gradient(135deg, rgba(255, 90, 54, 0.2), rgba(255, 138, 0, 0.2));
      border-color: rgba(255, 90, 54, 0.5);
      color: #FF8A00;
      font-weight: 600;
    }

    .ctrl-btn.highlight:hover {
      background: linear-gradient(135deg, rgba(255, 90, 54, 0.35), rgba(255, 138, 0, 0.35));
      color: #FFA436;
      box-shadow: 0 0 10px rgba(255, 90, 54, 0.3);
    }

    /* Main Workspace Layout */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 84px);
      position: relative;
      overflow: hidden;
    }

    /* Left Docs Pane */
    .docs-pane {
      width: 42%;
      min-width: 300px;
      max-width: 70%;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      padding: 24px 28px;
      line-height: 1.65;
      font-size: 13.5px;
      transition: width 0.1s ease;
    }

    .docs-pane.hidden {
      display: none;
    }

    .docs-content h1 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #FFFFFF;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .docs-content h2 {
      font-size: 16px;
      margin-top: 24px;
      margin-bottom: 12px;
      color: #FF8A00;
    }

    .docs-content h3 {
      font-size: 14px;
      margin-top: 18px;
      margin-bottom: 8px;
      color: #E5E7EB;
    }

    .docs-content p, .docs-content ul, .docs-content ol {
      margin-bottom: 14px;
      color: #D1D5DB;
    }

    .docs-content ul, .docs-content ol {
      padding-left: 20px;
    }

    .docs-content li {
      margin-bottom: 6px;
    }

    .docs-content strong {
      color: #FFFFFF;
    }

    .docs-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0;
      font-size: 12.5px;
    }

    .docs-content th, .docs-content td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: left;
    }

    .docs-content th {
      background-color: var(--card-bg);
      color: #FF8A00;
      font-weight: 600;
    }

    .docs-content blockquote {
      border-left: 3px solid var(--accent);
      padding: 8px 14px;
      background: rgba(255, 90, 54, 0.08);
      margin: 14px 0;
      color: #E5E7EB;
      font-style: italic;
      border-radius: 0 6px 6px 0;
    }

    .docs-content pre {
      background: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 14px 0;
      position: relative;
    }

    .docs-content code {
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 12px;
      color: #FF8A00;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .docs-content code:hover {
      background: rgba(255, 138, 0, 0.2);
    }

    .code-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #21262D;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #9CA3AF;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .code-copy-btn:hover {
      color: #FFFFFF;
      background: #30363D;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .code-copy-btn.copied {
      color: #34D399;
      border-color: #34D399;
    }

    /* Resizer Bar */
    .resizer {
      width: 5px;
      background: var(--card-bg);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      cursor: col-resize;
      transition: background 0.15s ease;
      z-index: 5;
    }

    .resizer:hover, .resizer.dragging {
      background: var(--accent);
    }

    /* Right Canvas Pane */
    .canvas-pane {
      flex: 1;
      height: 100%;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      overflow: hidden;
      position: relative;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas-pane:active {
      cursor: grabbing;
    }

    .viewport-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.05s ease-out;
    }

    .diagram-img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.7));
    }

    /* Footer Info Bar */
    footer {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 6px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      z-index: 10;
      flex-shrink: 0;
    }

    .zoom-badge {
      background: #05070A;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      border: 1px solid var(--border-color);
    }

    /* ==========================================================================
       Mermaid Live Editor & Studio Modal Styling
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      width: 96vw;
      max-width: 1520px;
      height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.95);
      overflow: hidden;
    }

    .modal-header {
      padding: 10px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0B0E14;
      flex-shrink: 0;
      gap: 12px;
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .modal-title {
      font-size: 13px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.2px;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Editor Tabs */
    .editor-tabs {
      display: flex;
      background: #05070A;
      padding: 2px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      gap: 2px;
    }

    .editor-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .editor-tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .editor-tab-btn.active {
      color: #FFFFFF;
      background: var(--code-bg);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Split Screen Body */
    .editor-split-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      background: #05070A;
      position: relative;
    }

    .editor-left-pane {
      width: 44%;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      background: #07090E;
    }

    .editor-right-pane {
      flex: 1;
      min-width: 340px;
      display: flex;
      flex-direction: column;
      background: #0B0E14;
      overflow: hidden;
      position: relative;
    }

    .editor-pane-toolbar {
      padding: 8px 14px;
      background: #0D1117;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .file-tag {
      font-family: Consolas, Monaco, monospace;
      font-size: 11px;
      color: #FF8A00;
      background: rgba(255, 138, 0, 0.12);
      border: 1px solid rgba(255, 138, 0, 0.25);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }

    .auto-render-tag {
      font-size: 11px;
      color: #34D399;
      font-family: monospace;
    }

    #mermaidEditorTextarea {
      flex: 1;
      width: 100%;
      background: #05070A;
      color: #F3F4F6;
      border: none;
      outline: none;
      resize: none;
      padding: 14px 16px;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre;
      tab-size: 4;
    }

    #mermaidEditorTextarea:focus {
      background: #07090E;
    }

    .editor-error-banner {
      display: none;
      background: rgba(220, 38, 38, 0.18);
      border-top: 1px solid rgba(239, 68, 68, 0.4);
      color: #FCA5A5;
      padding: 10px 14px;
      font-size: 11px;
      font-family: Consolas, Monaco, monospace;
      max-height: 110px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .editor-resizer {
      width: 6px;
      background: #111827;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      cursor: col-resize;
      transition: background 0.15s ease;
      z-index: 10;
    }

    .editor-resizer:hover, .editor-resizer.dragging {
      background: var(--accent);
    }

    .editor-preview-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      background: #080B10;
      background-image: 
        radial-gradient(circle, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 20px 20px;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .editor-preview-viewport:active {
      cursor: grabbing;
    }

    #editorPreviewContent {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.05s ease-out;
      padding: 20px;
    }

    #editorPreviewContent svg {
      max-width: 100%;
      max-height: 100%;
      display: block;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.6));
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #111827;
      color: #F3F4F6;
      border: 1px solid var(--accent);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), 0 0 14px var(--accent-glow);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      z-index: 1000;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">TS</div>
      <div>
        <div class="brand-title">TicketShield Studio</div>
        <div class="brand-sub">Architecture & State Engine</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-system" onclick="switchTab('system')">
        System Architecture
      </button>
      <button class="tab-btn" id="tab-state" onclick="switchTab('state')">
        1. Escrow State
      </button>
      <button class="tab-btn" id="tab-resale" onclick="switchTab('resale')">
        2. Resale Listing State
      </button>
    </div>

    <div class="controls">
      <!-- Live Mermaid Editor Button -->
      <button class="ctrl-btn highlight" id="btnShowMermaid" onclick="openMermaidModal()" title="Mở Studio Chỉnh Sửa & Render Trực Tiếp Mermaid">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        Live Mermaid Editor
      </button>
      <button class="ctrl-btn" id="btnCopyMermaid" onclick="copyCurrentMermaid()" title="Sao chép toàn bộ mã nguồn Mermaid">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Copy Mermaid
      </button>
      <button class="ctrl-btn active-toggle" id="btnToggleDocs" onclick="toggleDocs()" title="Toggle Docs Panel">
        Docs: On
      </button>
      <button class="ctrl-btn" onclick="zoomIn()" title="Zoom In">Zoom In</button>
      <button class="ctrl-btn" onclick="zoomOut()" title="Zoom Out">Zoom Out</button>
      <button class="ctrl-btn" onclick="resetZoom()" title="Reset Zoom">Reset</button>
      <button class="ctrl-btn" onclick="openSvgDirectly()" title="Full Canvas">Full Canvas</button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <!-- Left Docs Pane -->
    <div class="docs-pane" id="docsPane">
      <div class="docs-content" id="docsContent">
        <p>Loading...</p>
      </div>
    </div>

    <!-- Draggable Resizer -->
    <div class="resizer" id="resizer"></div>

    <!-- Right Canvas Pane -->
    <div class="canvas-pane" id="canvasPane" onwheel="handleWheel(event)" onmousedown="startPan(event)">
      <div class="viewport-container" id="container">
        <img id="diagramImage" class="diagram-img" src="./system/system.svg" alt="Architecture Diagram" />
      </div>
    </div>
  </div>

  <footer>
    <div>
      <span id="activeDocPath">docs/diagrams/system/system.md</span>
    </div>
    <div>
      <span class="zoom-badge" id="zoomPercent">100%</span>
    </div>
  </footer>

  <!-- ==========================================================================
       Mermaid Live Editor & Studio Modal
       ========================================================================== -->
  <div class="modal-backdrop" id="mermaidModal" style="display: none;" onclick="handleModalBackdropClick(event)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-group">
          <span class="badge" style="background: linear-gradient(135deg, #FF5A36, #FF8A00); color: white; border: none;">LIVE STUDIO</span>
          <span class="modal-title">Live Mermaid Editor</span>
          
          <!-- Diagram Switcher Tabs -->
          <div class="editor-tabs">
            <button class="editor-tab-btn active" id="btn-edit-system" onclick="switchEditorDiagram('system')">
              1. System Architecture
            </button>
            <button class="editor-tab-btn" id="btn-edit-state" onclick="switchEditorDiagram('state')">
              2. Escrow State
            </button>
            <button class="editor-tab-btn" id="btn-edit-resale" onclick="switchEditorDiagram('resale')">
              3. Resale Listing State
            </button>
          </div>
        </div>

        <div class="modal-actions">
          <button class="ctrl-btn active-toggle" onclick="triggerRenderLive()" title="Render lại sơ đồ ngay (Ctrl + Enter)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            Render (Ctrl+Enter)
          </button>
          <button class="ctrl-btn highlight" onclick="applyToMainCanvas()" title="Cập nhật sơ đồ vừa sửa ra Canvas chính của Studio">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Đưa lên Canvas
          </button>
          <button class="ctrl-btn" onclick="downloadEditorSvg()" title="Xuất file vector SVG">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Tải SVG
          </button>
          <button class="ctrl-btn" onclick="downloadEditorMmd()" title="Tải file mã nguồn .mmd">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            Tải .mmd
          </button>
          <button class="ctrl-btn" onclick="copyEditorCode()" title="Sao chép toàn bộ mã nguồn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            Copy
          </button>
          <button class="ctrl-btn" onclick="resetEditorCode()" title="Khôi phục mã mẫu gốc ban đầu">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
            Reset
          </button>
          <button class="ctrl-btn" onclick="closeMermaidModal()" title="Đóng Editor">Đóng (ESC)</button>
        </div>
      </div>

      <!-- Split Screen Body -->
      <div class="editor-split-container">
        <!-- Left: Code Editor -->
        <div class="editor-left-pane">
          <div class="editor-pane-toolbar">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="file-tag" id="editorCurrentFilename">system.mmd</span>
              <span style="font-size: 11px; color: var(--text-muted);" id="editorStats">0 dòng | 0 ký tự</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="auto-render-tag" id="editorRenderStatus">Auto-render: Bật</span>
            </div>
          </div>
          <textarea id="mermaidEditorTextarea" spellcheck="false" placeholder="Nhập mã Mermaid tại đây..."></textarea>
          <div class="editor-error-banner" id="editorErrorBanner"></div>
        </div>

        <!-- Draggable Divider -->
        <div class="editor-resizer" id="editorResizer"></div>

        <!-- Right: Live SVG Preview -->
        <div class="editor-right-pane">
          <div class="editor-pane-toolbar">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 11px; font-weight: 700; color: #9CA3AF; text-transform: uppercase;">Xem Trước Trực Quan (Live SVG Preview)</span>
              <span class="badge" id="previewEngineBadge" style="background: rgba(34, 197, 94, 0.15); color: #4ADE80; border-color: rgba(34, 197, 94, 0.3);">Offline 0ms</span>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <button class="ctrl-btn" onclick="previewZoomIn()" title="Phóng to">+</button>
              <button class="ctrl-btn" onclick="previewZoomOut()" title="Thu nhỏ">-</button>
              <button class="ctrl-btn" onclick="previewResetZoom()" title="Reset tỉ lệ">Reset</button>
              <span class="zoom-badge" id="previewZoomPercent">100%</span>
            </div>
          </div>
          <div class="editor-preview-viewport" id="editorPreviewViewport" onwheel="handlePreviewWheel(event)" onmousedown="startPreviewPan(event)">
            <div id="editorPreviewContent">
              <div style="color: #6B7280; text-align: center; padding: 40px;">Đang tải bộ vẽ sơ đồ Mermaid...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">Đã sao chép vào bộ nhớ tạm</div>

  <script>
    let currentTab = 'system';
    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let isPanning = false;
    let startX = 0;
    let startY = 0;
    let docsVisible = true;

    // Toast Notification
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1800);
    }

    // Secure & Fallback Clipboard Copy
    async function copyToClipboard(text) {
      if (!text) return false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {}

      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        const success = document.execCommand('copy');
        textarea.remove();
        return success;
      } catch (err) {
        return false;
      }
    }

    // Enhance Markdown Code Blocks with Copy Buttons & Inline Click-to-Copy
    function enhanceCodeBlocks() {
      if (!docsContent) return;

      docsContent.querySelectorAll('pre').forEach(pre => {
        if (pre.querySelector('.code-copy-btn')) return;

        const copyBtn = document.createElement('button');
        copyBtn.className = 'code-copy-btn';
        copyBtn.innerHTML = `
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy
        `;
        copyBtn.title = "Sao chép khối mã";
        copyBtn.onclick = async (e) => {
          e.stopPropagation();
          const codeEl = pre.querySelector('code');
          const codeText = codeEl ? codeEl.innerText : pre.innerText;
          const ok = await copyToClipboard(codeText);
          if (ok) {
            copyBtn.classList.add('copied');
            copyBtn.innerHTML = `
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Copied!
            `;
            showToast("Đã sao chép khối mã");
            setTimeout(() => {
              copyBtn.classList.remove('copied');
              copyBtn.innerHTML = `
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy
              `;
            }, 2000);
          }
        };
        pre.appendChild(copyBtn);
      });

      docsContent.querySelectorAll(':not(pre) > code').forEach(code => {
        if (code.dataset.copyBound) return;
        code.dataset.copyBound = "true";
        code.title = "Bấm để sao chép";
        code.onclick = async (e) => {
          e.stopPropagation();
          const text = code.innerText.trim();
          const ok = await copyToClipboard(text);
          if (ok) {
            const preview = text.length > 25 ? text.slice(0, 25) + '...' : text;
            showToast(`Đã sao chép: "${preview}"`);
          }
        };
      });
    }

    // ==========================================================================
    // Mermaid Live Editor Engine
    // ==========================================================================
    let editorCurrentDiagram = 'system';
    let activeEditorCode = {};
    let editorDebounceTimer = null;
    let renderSeq = 0;

    // Preview zoom & pan state
    let previewScale = 1;
    let previewTranslateX = 0;
    let previewTranslateY = 0;
    let isPanningPreview = false;
    let previewStartX = 0;
    let previewStartY = 0;

    const DIAGRAM_METADATA = {
      system: { name: 'System Architecture', file: 'system.mmd' },
      state: { name: 'Escrow State Machine', file: 'escrow_transaction.mmd' },
      resale: { name: 'Resale Listing State Machine', file: 'resale_listing.mmd' }
    };

    function initMermaidEngine() {
      if (window.mermaid) {
        try {
          mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',
            themeVariables: {
              darkMode: true,
              background: '#0B0E14',
              primaryColor: '#1F2937',
              primaryTextColor: '#F3F4F6',
              primaryBorderColor: '#FF5A36',
              lineColor: '#FF5A36',
              secondaryColor: '#111827',
              tertiaryColor: '#0F172A',
              fontSize: '15px'
            }
          });
        } catch (e) {
          console.warn("Mermaid init warning:", e);
        }
      }
    }

    function initActiveEditorCode() {
      if (typeof EMBEDDED_MERMAID !== 'undefined') {
        for (const k in EMBEDDED_MERMAID) {
          if (!activeEditorCode[k]) {
            activeEditorCode[k] = EMBEDDED_MERMAID[k];
          }
        }
      }
    }

    function openMermaidModal(targetKey) {
      initMermaidEngine();
      initActiveEditorCode();

      const key = targetKey || (currentTab === 'state' ? 'state' : 'system');
      switchEditorDiagram(key);

      document.getElementById('mermaidModal').style.display = 'flex';
      previewResetZoom();
    }

    function closeMermaidModal() {
      document.getElementById('mermaidModal').style.display = 'none';
    }

    function handleModalBackdropClick(e) {
      if (e.target.id === 'mermaidModal') {
        closeMermaidModal();
      }
    }

    function updateEditorStats(code) {
      const lines = code ? code.split('\n').length : 0;
      const chars = code ? code.length : 0;
      const statsEl = document.getElementById('editorStats');
      if (statsEl) {
        statsEl.textContent = `${lines} dòng | ${chars} ký tự`;
      }
    }

    function switchEditorDiagram(key) {
      const textarea = document.getElementById('mermaidEditorTextarea');
      // Save current edited code
      if (textarea && editorCurrentDiagram) {
        activeEditorCode[editorCurrentDiagram] = textarea.value;
      }

      editorCurrentDiagram = key;

      // Update Tab Pill UI
      document.querySelectorAll('.editor-tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-edit-${key}`);
      if (activeBtn) activeBtn.classList.add('active');

      // Update filename tag
      const meta = DIAGRAM_METADATA[key] || { file: `${key}.mmd` };
      document.getElementById('editorCurrentFilename').textContent = meta.file;

      // Load code into textarea
      const code = activeEditorCode[key] || (typeof EMBEDDED_MERMAID !== 'undefined' && EMBEDDED_MERMAID[key]) || '';
      if (textarea) {
        textarea.value = code;
        updateEditorStats(code);
      }

      renderLivePreview(code);
    }

    async function renderLivePreview(codeToRender) {
      const textarea = document.getElementById('mermaidEditorTextarea');
      const code = typeof codeToRender === 'string' ? codeToRender : (textarea ? textarea.value : '');
      const previewBox = document.getElementById('editorPreviewContent');
      const errorBox = document.getElementById('editorErrorBanner');
      const renderStatus = document.getElementById('editorRenderStatus');

      if (!previewBox) return;

      if (!code || !code.trim()) {
        previewBox.innerHTML = '<div style="color: #6B7280; text-align: center; padding: 40px;">Chưa có mã Mermaid để hiển thị</div>';
        if (errorBox) errorBox.style.display = 'none';
        return;
      }

      try {
        renderSeq++;
        const id = 'mermaid-editor-svg-' + renderSeq;
        
        // Remove previous residual elements if any
        const oldResidual = document.getElementById('d' + id);
        if (oldResidual) oldResidual.remove();

        if (window.mermaid) {
          // Pre-validate syntax
          await mermaid.parse(code);
          const { svg } = await mermaid.render(id, code);
          previewBox.innerHTML = svg;
          if (errorBox) errorBox.style.display = 'none';
          if (renderStatus) {
            renderStatus.textContent = "Hợp lệ 100%";
            renderStatus.style.color = "#34D399";
          }
        } else {
          // Fallback to mermaid.ink if offline JS is unavailable
          const b64 = btoa(unescape(encodeURIComponent(JSON.stringify({ code }))));
          previewBox.innerHTML = `<img src="https://mermaid.ink/svg/${b64}" style="max-width:100%;height:auto;" />`;
          if (errorBox) errorBox.style.display = 'none';
        }
      } catch (err) {
        if (errorBox) {
          errorBox.textContent = `❌ Lỗi cú pháp Mermaid: ${err.message || err.str || err.toString()}`;
          errorBox.style.display = 'block';
        }
        if (renderStatus) {
          renderStatus.textContent = "Lỗi cú pháp";
          renderStatus.style.color = "#EF4444";
        }
      }
    }

    function triggerRenderLive() {
      const textarea = document.getElementById('mermaidEditorTextarea');
      if (textarea) {
        activeEditorCode[editorCurrentDiagram] = textarea.value;
        renderLivePreview(textarea.value);
        showToast('Đã render sơ đồ!');
      }
    }

    function applyToMainCanvas() {
      const previewBox = document.getElementById('editorPreviewContent');
      const svgEl = previewBox ? previewBox.querySelector('svg') : null;

      if (!svgEl) {
        showToast('Không có sơ đồ hợp lệ để áp dụng');
        return;
      }

      try {
        const svgXml = new XMLSerializer().serializeToString(svgEl);
        const blob = new Blob([svgXml], { type: 'image/svg+xml;charset=utf-8' });
        const blobUrl = URL.createObjectURL(blob);

        diagramImage.src = blobUrl;
        resetZoom();
        showToast(`Đã áp dụng sơ đồ ${DIAGRAM_METADATA[editorCurrentDiagram].name} lên Canvas!`);
        closeMermaidModal();
      } catch (err) {
        showToast('Lỗi khi áp dụng lên Canvas: ' + err.message);
      }
    }

    function downloadEditorSvg() {
      const previewBox = document.getElementById('editorPreviewContent');
      const svgEl = previewBox ? previewBox.querySelector('svg') : null;

      if (!svgEl) {
        showToast('Chưa có SVG hợp lệ để tải về');
        return;
      }

      const svgXml = new XMLSerializer().serializeToString(svgEl);
      const blob = new Blob([svgXml], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${editorCurrentDiagram}.svg`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(`Đã tải về: ${editorCurrentDiagram}.svg`);
    }

    function downloadEditorMmd() {
      const textarea = document.getElementById('mermaidEditorTextarea');
      const code = textarea ? textarea.value : '';
      const meta = DIAGRAM_METADATA[editorCurrentDiagram] || { file: `${editorCurrentDiagram}.mmd` };
      
      const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = meta.file;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(`Đã tải về: ${meta.file}`);
    }

    async function copyEditorCode() {
      const textarea = document.getElementById('mermaidEditorTextarea');
      const code = textarea ? textarea.value : '';
      const ok = await copyToClipboard(code);
      if (ok) {
        showToast(`Đã sao chép mã nguồn ${DIAGRAM_METADATA[editorCurrentDiagram].name}`);
      }
    }

    function resetEditorCode() {
      if (typeof EMBEDDED_MERMAID !== 'undefined' && EMBEDDED_MERMAID[editorCurrentDiagram]) {
        activeEditorCode[editorCurrentDiagram] = EMBEDDED_MERMAID[editorCurrentDiagram];
        const textarea = document.getElementById('mermaidEditorTextarea');
        if (textarea) {
          textarea.value = activeEditorCode[editorCurrentDiagram];
          updateEditorStats(textarea.value);
        }
        renderLivePreview(activeEditorCode[editorCurrentDiagram]);
        showToast('Đã khôi phục mã mẫu gốc!');
      }
    }

    // Auto-indent & Debounced live preview setup
    const textareaEl = document.getElementById('mermaidEditorTextarea');
    if (textareaEl) {
      textareaEl.addEventListener('keydown', (e) => {
        // Tab key inserts 4 spaces
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = textareaEl.selectionStart;
          const end = textareaEl.selectionEnd;
          const val = textareaEl.value;
          textareaEl.value = val.substring(0, start) + '    ' + val.substring(end);
          textareaEl.selectionStart = textareaEl.selectionEnd = start + 4;
          updateEditorStats(textareaEl.value);
          if (editorDebounceTimer) clearTimeout(editorDebounceTimer);
          editorDebounceTimer = setTimeout(() => {
            renderLivePreview(textareaEl.value);
          }, 350);
        }
        // Ctrl + Enter to render
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          triggerRenderLive();
        }
      });

      textareaEl.addEventListener('input', () => {
        updateEditorStats(textareaEl.value);
        if (editorDebounceTimer) clearTimeout(editorDebounceTimer);
        editorDebounceTimer = setTimeout(() => {
          renderLivePreview(textareaEl.value);
        }, 350);
      });
    }

    // Preview Pane Pan & Zoom Controls
    const previewViewport = document.getElementById('editorPreviewViewport');
    const previewContent = document.getElementById('editorPreviewContent');
    const previewZoomPercent = document.getElementById('previewZoomPercent');

    function updatePreviewTransform() {
      if (previewContent) {
        previewContent.style.transform = `translate(${previewTranslateX}px, ${previewTranslateY}px) scale(${previewScale})`;
      }
      if (previewZoomPercent) {
        previewZoomPercent.textContent = `${Math.round(previewScale * 100)}%`;
      }
    }

    function previewZoomIn() {
      previewScale = Math.min(previewScale * 1.25, 5);
      updatePreviewTransform();
    }

    function previewZoomOut() {
      previewScale = Math.max(previewScale / 1.25, 0.2);
      updatePreviewTransform();
    }

    function previewResetZoom() {
      previewScale = 1;
      previewTranslateX = 0;
      previewTranslateY = 0;
      updatePreviewTransform();
    }

    function handlePreviewWheel(e) {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      previewScale = Math.min(Math.max(previewScale * zoomFactor, 0.2), 5);
      updatePreviewTransform();
    }

    function startPreviewPan(e) {
      if (e.button !== 0) return;
      isPanningPreview = true;
      previewStartX = e.clientX - previewTranslateX;
      previewStartY = e.clientY - previewTranslateY;

      window.addEventListener('mousemove', onPreviewPan);
      window.addEventListener('mouseup', endPreviewPan);
    }

    function onPreviewPan(e) {
      if (!isPanningPreview) return;
      previewTranslateX = e.clientX - previewStartX;
      previewTranslateY = e.clientY - previewStartY;
      updatePreviewTransform();
    }

    function endPreviewPan() {
      isPanningPreview = false;
      window.removeEventListener('mousemove', onPreviewPan);
      window.removeEventListener('mouseup', endPreviewPan);
    }

    // Modal Split Pane Resizing
    const editorResizer = document.getElementById('editorResizer');
    const editorLeftPane = document.querySelector('.editor-left-pane');
    let isEditorResizing = false;

    if (editorResizer && editorLeftPane) {
      editorResizer.addEventListener('mousedown', (e) => {
        isEditorResizing = true;
        editorResizer.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isEditorResizing) return;
        const containerWidth = document.querySelector('.editor-split-container').offsetWidth;
        const newWidth = (e.clientX / containerWidth) * 100;
        if (newWidth > 20 && newWidth < 80) {
          editorLeftPane.style.width = `${newWidth}%`;
        }
      });

      window.addEventListener('mouseup', () => {
        if (isEditorResizing) {
          isEditorResizing = false;
          editorResizer.classList.remove('dragging');
          document.body.style.cursor = 'default';
        }
      });
    }

    // Direct Copy from header
    async function copyCurrentMermaid() {
      const key = currentTab === 'resale' ? 'resale' : (currentTab === 'state' ? 'state' : 'system');
      const code = (typeof EMBEDDED_MERMAID !== 'undefined' && EMBEDDED_MERMAID[key]) || '';
      const ok = await copyToClipboard(code);
      if (ok) {
        const btn = document.getElementById('btnCopyMermaid');
        btn.innerHTML = `
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Đã chép!
        `;
        const label = key === 'system' ? 'System' : (key === 'resale' ? 'Resale Listing' : 'Escrow State');
        showToast(`Đã sao chép mã Mermaid (${label})`);
        setTimeout(() => {
          btn.innerHTML = `
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            Copy Mermaid
          `;
        }, 2000);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMermaidModal();
      }
    });

    const container = document.getElementById('container');
    const diagramImage = document.getElementById('diagramImage');
    const docsPane = document.getElementById('docsPane');
    const resizer = document.getElementById('resizer');
    const docsContent = document.getElementById('docsContent');
    const zoomPercent = document.getElementById('zoomPercent');
    const btnToggleDocs = document.getElementById('btnToggleDocs');

    // Pan & Zoom Engine for Main Canvas
    function updateTransform() {
      container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      zoomPercent.textContent = `Zoom: ${Math.round(scale * 100)}%`;
    }

    function zoomIn() {
      scale = Math.min(scale * 1.25, 5);
      updateTransform();
    }

    function zoomOut() {
      scale = Math.max(scale / 1.25, 0.2);
      updateTransform();
    }

    function resetZoom() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    }

    function handleWheel(e) {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      scale = Math.min(Math.max(scale * zoomFactor, 0.2), 5);
      updateTransform();
    }

    function startPan(e) {
      if (e.button !== 0) return;
      isPanning = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;

      window.addEventListener('mousemove', onPan);
      window.addEventListener('mouseup', endPan);
    }

    function onPan(e) {
      if (!isPanning) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    }

    function endPan() {
      isPanning = false;
      window.removeEventListener('mousemove', onPan);
      window.removeEventListener('mouseup', endPan);
    }

    function toggleDocs() {
      docsVisible = !docsVisible;
      docsPane.classList.toggle('hidden', !docsVisible);
      resizer.style.display = docsVisible ? 'block' : 'none';
      btnToggleDocs.textContent = docsVisible ? 'Docs: On' : 'Docs: Off';
      btnToggleDocs.classList.toggle('active-toggle', docsVisible);
    }

    function openSvgDirectly() {
      window.open(diagramImage.src, '_blank');
    }

    const EMBEDDED_DOCS = {"system": "# TICKETSHIELD AI - SYSTEM ARCHITECTURE DIAGRAM & DEFENSE MASTERCLASS\n> **Tài liệu phục vụ:** Báo cáo đồ án tốt nghiệp Capstone FA26SE261 (GVHD: Thân Thị Ngọc Vân)  \n> **Chủ đề:** Biểu đồ Kiến trúc Hệ thống Tổng quan (System Architecture Overview Diagram)  \n> **Tác giả:** Hoàng Thông và Đội ngũ Kỹ thuật TicketShield  \n\n---\n\n\n\n> 💡 **File Mermaid độc lập:** Mã nguồn kiến trúc đã được tách riêng tại file [`system.mmd`](./system.mmd) phục vụ chỉnh sửa độc lập và nạp trực tiếp vào Studio Live Editor.\n\n---\n\n## 2. CHI TIẾT TỪNG PHÂN TẦNG VÀ KHỐI NGHIỆP VỤ (COMPONENT BREAKDOWN)\n\n### 2.1. Phân tầng Người dùng và Client (Users and Client)\n- **Client Application (Ứng dụng Web):** Giao diện tương tác chính cho Người mua (tìm kiếm vé, checkout, khiếu nại), Người bán (đăng bán vé, nhận tiền giải ngân) và Ban quản trị (thẩm định tranh chấp, cấu hình sàn).\n- **Client Telemetry Collector:** Module chạy ngầm tại trang thanh toán thu thập các tín hiệu thời gian thao tác (timing), tần suất bấm (velocity) và dấu hiệu môi trường thiết bị để gửi qua Gateway sang dịch vụ chống bot.\n\n---\n\n### 2.2. Ranh giới Hệ thống TicketShield (System Boundary)\nToàn bộ phạm vi nghiệp vụ do đội ngũ TicketShield làm chủ và vận hành:\n\n1. **Cổng Điều Phối API (API Gateway):**\n   - Điểm tiếp nhận duy nhất cho mọi yêu cầu từ phía Client.\n   - Chịu trách nhiệm bảo vệ an ninh biên giới (Perimeter Defense), kiểm soát CORS tập trung và phân luồng định tuyến thông minh vào các dịch vụ nghiệp vụ nội bộ.\n\n2. **Khối Nghiệp Vụ Cốt Lõi (Core Business Services):**\n   - **Dịch Vụ Xác Thực và Phân Quyền (Identity and Access Service):** Định danh tài khoản, quản lý phiên và phân quyền RBAC (Admin, Moderator, Customer).\n   - **Dịch Vụ Giao Dịch và Sàn Bán Lại (Marketplace and Trading Service):** Quản lý sự kiện, tin đăng bán vé lẻ/combo, kiểm soát giữ chỗ đồng thời (CAS) và phối hợp sang tên vé chính chủ với BTC.\n   - **Dịch Vụ Quản Lý Ký Quỹ và Tranh Chấp (Escrow and Dispute Service):** Lưu ký bảo vệ tiền 24h (Dual-Condition Escrow Buffer), phong tỏa khiếu nại và kích hoạt lệnh giải ngân an toàn.\n   - **Dịch Vụ Quyết Toán và Giải Ngân (Settlement and Payout Service - MF-04):** Microservice chuyên trách độc lập tiền ra (Pay-out), lắng nghe sự kiện từ Event Bus, thực thi các vòng lặp Retry Worker và gọi cổng ngân hàng chuyển khoản tự động.\n\n3. **Phân Hệ Trí Tuệ Nhân Tạo (AI Defense Subsystem - FastAPI Microservice Độc Lập):**\n   - **Dịch Vụ Phát Hiện Bot & Gian Lận (AI Anti-Bot & Fraud Engine):** Tiếp nhận vector telemetry phiên mua, tính toán điểm rủi ro (Risk Scoring) qua mô hình Machine Learning và đưa ra phán quyết (Pass, Challenge, Block).\n   - **Kho Dữ Liệu Dấu Vết Hành Vi (Behavioral Telemetry Store):** Lưu trữ độc lập telemetry logs và audit trail phục vụ đối soát và tái huấn luyện mô hình mà không làm chậm Core Database.\n\n4. **Trục Tích Hợp Bất Đồng Bộ (Event Bus - RabbitMQ):**\n   - Đóng vai trò cầu nối lỏng (Loose Coupling) giữa các dịch vụ, đảm bảo tính nhất quán dữ liệu cuối cùng (Eventual Consistency) và truyền tải sự kiện giải ngân sang Settlement Service.\n\n5. **Tầng Lưu Trữ Dữ Liệu (Data Stores):**\n   - **Cơ Sở Dữ Liệu Hệ Thống (Core Relational Database - `ticketshield_db`):** Quản trị tập trung giao dịch tài chính, tài khoản, vé niêm yết và hợp đồng ký quỹ tuân thủ chuẩn ACID.\n   - **Cơ Sở Dữ Liệu Quyết Toán (Settlement Database - `settlement_db`):** Database độc lập của Settlement Service, theo dõi chi tiết từng đợt đối soát, mã giao dịch ngân hàng và lịch sử thanh toán tiền ra cho người bán.\n\n---\n\n### 2.3. Dịch Vụ Đối Tác Bên Thứ Ba (Third-Party Services)\nCác hệ thống độc lập bên ngoài ranh giới của TicketShield:\n\n1. **Hệ Thống Đối Tác (Event Organizer System / Simulator):**\n   - Cung cấp giao diện dịch vụ để TicketShield xác thực mã vé gốc và thực hiện lệnh vô hiệu hóa vé cũ để phát hành mã vé mới chính chủ cho người mua.\n   - Cung cấp nhật ký quét cổng vào cửa phục vụ đối soát khi có tranh chấp.\n\n2. **Cổng Thanh Toán Trực Tuyến (Payment Gateway - Thu Tiền Vào):**\n   - Tiếp nhận giao dịch chuyển khoản VietQR từ người mua và gửi Webhook thông báo kết quả thanh toán trực tiếp về Dịch vụ Giao dịch (Core).\n\n3. **Cổng Chuyển Khoản Liên Ngân Hàng (Banking Payout Service - Chi Tiền Ra - NAPAS 247):**\n   - Tiếp nhận lệnh giải ngân tự động từ Dịch vụ Quyết toán (Settlement Service) để bắn tiền trực tiếp về số tài khoản ngân hàng của người bán.\n\n---\n\n## 3. CÂU HỎI HỘI ĐỒNG VỀ KIẾN TRÚC VÀ CÁCH TRẢ LỜI\n\n### Câu hỏi 1: Tại sao sơ đồ kiến trúc phải phân định rõ Ranh giới Hệ thống (System Boundary) và Dịch vụ Bên thứ ba?\n> **Trả lời:**  \n> *\"Thưa Hội đồng, việc phân định rõ System Boundary là nguyên tắc cốt lõi của kiến trúc phần mềm:  \n> 1. **Xác định rõ ranh giới trách nhiệm (Scope of Responsibility):** TicketShield chỉ làm chủ logic lưu ký, sàn giao dịch và công nghệ chống bot. Các phần việc phát hành vé gốc thuộc về Ban tổ chức, còn thanh toán thuộc về Cổng thanh toán và Ngân hàng.  \n> 2. **Kiểm soát bề mặt an ninh:** Mọi tương tác đi qua biên giới hệ thống đều phải đi qua Gateway và các giao thức bảo mật chặt chẽ, loại bỏ hoàn toàn các kết nối tùy tiện giữa client ngoài Internet và dịch vụ nội bộ.\"*\n\n---\n\n### Câu hỏi 2: Vai trò của Hệ thống Phân phối Sự Kiện (Event Bus) trong kiến trúc là gì?\n> **Trả lời:**  \n> *\"Thưa Hội đồng, Event Bus đóng vai trò là xương sống kết nối bất đồng bộ giữa các phân hệ:  \n> - Khi người dùng cập nhật hồ sơ hoặc đổi số tài khoản ngân hàng, Dịch vụ Xác thực chỉ cần bắn sự kiện lên Event Bus. Dịch vụ Giao dịch tự động lắng nghe và cập nhật bản ghi mà hai dịch vụ không cần phụ thuộc trực tiếp vào nhau.  \n> - Điều này đảm bảo tính độc lập (Decoupling) và giúp hệ thống có khả năng chịu lỗi cao (Fault Tolerance).\"*\n\n---\n\n### Câu hỏi 3: Làm thế nào hệ thống đảm bảo người mua nhận được vé hợp lệ từ Ban tổ chức mà không bị lừa vé giả?\n> **Trả lời:**  \n> *\"Thưa Hội đồng, hệ thống tích hợp trực tiếp 2 chiều với Hệ Thống Đối Tác (Event Organizer System):  \n> - Trước khi niêm yết: Mã vé được gửi sang đối tác để xác minh tình trạng vé và phong tỏa vé gốc.  \n> - Khi người mua thanh toán: Hệ thống gửi yêu cầu sang tên chính chủ, hủy mã vé cũ của người bán và sinh mã QR mới tinh chính chủ gửi thẳng vào tài khoản người mua. Người mua hoàn toàn không nhận ảnh chụp màn hình hay mã vé cũ từ tay người bán.\"*\n\n---\n\n### Câu hỏi 4: Cơ chế Ký quỹ bảo vệ quyền lợi người mua và người bán như thế nào?\n> **Trả lời:**  \n> *\"Thưa Hội đồng, Dịch vụ Ký quỹ (Escrow Service) giữ vai trò trọng tài tài chính trung gian:  \n> - Tiền thanh toán của người mua được khóa an toàn trong két ký quỹ trong thời gian đệm bảo đảm (24 giờ sau khi sang tên hoặc cho đến khi vé được quét thành công tại cổng soát vé).  \n> - Nếu vé phát sinh lỗi tại cổng, người mua nộp khiếu nại, tiền được đóng băng lập tức để đối soát và hoàn 100%. Nếu không có khiếu nại, hệ thống tự động kích hoạt lệnh chuyển tiền qua Dịch vụ Chuyển khoản Ngân hàng cho người bán.\"*", "state": "# TICKETSHIELD AI - STATE DIAGRAM & STATE MACHINE MASTERCLASS\n> **Tài liệu phục vụ:** Báo cáo đồ án tốt nghiệp Capstone FA26SE261 (GVHD: Thân Thị Ngọc Vân)  \n> **Chủ đề:** Biểu đồ Máy Trạng thái Chuẩn UML & Đặc tả Nghiệp vụ (UML State Machine Diagrams)  \n> **Căn cứ hoàn thiện:** Biên bản góp ý Review 5 & Chuẩn thiết kế Abstract của Giảng viên hướng dẫn  \n> **Tác giả:** Hoàng Thông & Đội ngũ Kỹ thuật TicketShield  \n\n---\n\n## 0. NGUYÊN TẮC THIẾT KẾ ABSTRACT THEO CHỈ ĐẠO CỦA GIẢNG VIÊN (REVIEW 5)\n\nTại buổi báo cáo tiến độ Review 5 (mốc `[27:28]`), GVHD Thân Thị Ngọc Vân đã nhấn mạnh nguyên tắc cốt lõi:\n> *\"Giai đoạn phân tích thiết kế chỉ mang tính trừu tượng (abstract), đừng bóc tách quá vụn ở mức code, đừng vẽ mịn quá kẻo dễ sai.\"*\n\nNhóm áp dụng triệt để mô hình **Thiết kế 2 Tầng (Two-Layer Specification)**:\n1. **Tầng 1 — Trực quan hóa (Visual Diagrams):** Giữ sơ đồ cực kỳ tinh gọn, thoáng đãng, chỉ gồm **Tên State** và **Tên Event kích hoạt ngắn gọn**. Lược bỏ toàn bộ Guard condition `[...]` và Action `/ ...` chằng chịt trên mũi tên để người đọc nắm bắt ngay bức tranh tổng thể vòng đời.\n2. **Tầng 2 — Thuyết minh Nghiệp vụ (Business Decision Notes & Transition Matrices):** Chuyển toàn bộ các quy tắc ràng buộc, con số cấu hình của Admin, luật bảo vệ ký quỹ, và cơ chế đối soát log vào bảng ma trận bên dưới.\n\nHệ thống phân định rạch ròi thành 2 State Machine độc lập theo 2 thực thể trong CSDL:\n- **Thực thể Trọng tâm — `EscrowTransaction`:** Vòng đời Đơn hàng & Két ký quỹ giữ tiền an toàn (hội tụ luồng Ký quỹ Admin cấu hình, Giải ngân và Phân xử sự cố vé lỗi tại cổng).\n- **Thực thể Bổ trợ — `ResaleListing`:** Vòng đời Tin đăng bán vé của người bán (xác thực OTP Gmail từ BTC, niêm yết theo trần giá và đóng sàn trước giờ diễn).\n\n---\n\n\n\n\n\n---\n\n### 1.2. Biểu đồ Bổ trợ: Vòng đời Tin đăng bán vé (`ResaleListing`)\n\n[Toàn màn hình](./resale_listing.svg) · [Studio](../viewer.html)\n\n<p align=\"center\">\n  <a href=\"./resale_listing.svg\">\n    <img src=\"./resale_listing.svg\" alt=\"State Diagram - ResaleListing\" style=\"width: 100%; max-width: 100%; border-radius: 8px; border: 1px solid #30363D; background: #0B0E14; display: block;\" />\n  </a>\n</p>\n\n\n\n---\n\n## 2. BẢN GHI CHÚ QUYẾT ĐỊNH NGHIỆP VỤ & MA TRẬN CHUYỂN TRẠNG THÁI\n\n### 2.1. Quyết định Nghiệp vụ cho `EscrowTransaction` (Căn cứ Review 5)\n\n* **Cơ chế Két ký quỹ (`Escrowed`) `[03:02, 06:13]`:**  \n  Sau khi thanh toán thành công, toàn bộ tiền của Người mua được giữ an toàn trong két ký quỹ của sàn trong một khoảng thời gian đệm do Admin cấu hình (mặc định T+24h sau khi sang tên hoặc rút ngắn khi vé quét cổng thành công).\n* **Báo cáo sự cố tại cổng (`Disputed`) `[03:42]`:**  \n  Nếu vé bị lỗi không quét được cổng, Người mua phải liên kết tài khoản ngân hàng trước để nhận hoàn tiền, sau đó gửi khiếu nại kèm ảnh minh chứng và mô tả chi tiết (tối thiểu 10 ký tự). Két ký quỹ lập tức bị đóng băng tự động.\n* **Quy trình Phán quyết của Quản trị viên `[05:21, 07:35, 09:13]`:**  \n  Admin đối soát với nhật ký quét vé từ cổng hệ thống của Ban tổ chức (Gate Access Logs):\n  - **Duyệt khiếu nại (`ApproveClaim`):** Xác nhận vé lỗi/vé bị từ chối -> Kích hoạt lệnh hoàn tiền 100% từ két ký quỹ về STK người mua (`Refunded`); trừ điểm uy tín người bán (BR-D07).\n  - **Bác bỏ khiếu nại (`RejectClaim`):** Log cổng chứng minh người mua đã quét vé vào xem sự kiện bình thường (khiếu nại gian lận) -> Trả giao dịch về `Escrowed`. Bộ đếm giờ tiếp tục đếm nốt phần thời gian bảo hiểm còn lại; nếu thời hạn đã kết thúc, hệ thống tự động chuyển sang `PayoutPending`.\n* **Giải ngân hai bước (`PayoutPending` -> `Disbursed`) `[00:13:03]`:**  \n  Khi hết thời hạn ký quỹ an toàn mà không có khiếu nại, giao dịch chuyển sang `PayoutPending` để Admin thực hiện đối soát và phê duyệt chuyển tiền về STK người bán qua cổng thanh toán NAPAS 247.\n\n#### Ma trận Chuyển trạng thái `EscrowTransaction`\n\n| Trạng thái Nguồn | Sự kiện (Trigger) | Điều kiện rào (Guard) | Hành vi / Tác động tài sản (Action) | Trạng thái Đích |\n| :--- | :--- | :--- | :--- | :--- |\n| **[*]** | `SelectTicket` | Trước giờ đóng sàn (`BeforeCutoffTime`) | Khóa giữ vé; sinh mã VietQR động; tạo bản ghi ký quỹ `Pending`. | **Pending** |\n| **Pending** | `PaymentTimeout` | Quá hạn 10 phút giữ chỗ | Giải phóng vé đang giữ về lại sàn; đóng giao dịch. | **Expired** |\n| **Pending** | `CancelOrder` | Người mua chủ động hủy | Giải phóng vé đang giữ về lại sàn; hủy giao dịch. | **Cancelled** |\n| **Pending** | `PaymentSuccess` | Cổng thanh toán báo nhận tiền | Gọi gRPC sang tên chính chủ cho Buyer; đóng băng tiền vào két ký quỹ. | **Escrowed** |\n| **Escrowed** | `HoldingPeriodEnded` | Hết thời gian ký quỹ do Admin cấu hình & Không có khiếu nại | Chạy Atomic CAS: chuyển giao dịch vào danh sách chờ giải ngân. | **PayoutPending** |\n| **PayoutPending** | `ApprovePayout` | Admin phê duyệt đối soát | Kích hoạt chuyển khoản ngân hàng về STK người bán; cập nhật giải ngân thành công. | **Disbursed** |\n| **Escrowed** | `ReportDispute` | Trong thời hạn ký quỹ & Người mua báo lỗi vé tại cổng | Chạy Atomic CAS: lập tức phong tỏa két ký quỹ; đình chỉ giải ngân. | **Disputed** |\n| **Disputed** | `ApproveClaim` | Admin xác nhận vé lỗi từ log cổng BTC | Hoàn tiền 100% từ két ký quỹ về STK người mua; trừ điểm uy tín người bán. | **Refunded** |\n| **Disputed** | `RejectClaim` | Admin xác nhận vé đã quét vào cổng thành công | Mở đóng băng quỹ; trả về `Escrowed` để tiếp tục thời gian đệm bảo vệ thông thường. | **Escrowed** |\n| **Disbursed / Refunded / Expired / Cancelled** | **[*]** | Hoàn tất chu trình | Lưu vết nhật ký kiểm toán (Audit Trail); đóng vòng đời giao dịch. | **[*]** |\n\n---\n\n### 2.2. Quyết định Nghiệp vụ cho `ResaleListing` (Căn cứ Review 5)\n\n* **Xác thực vé gốc chính chủ bằng OTP Gmail `[00:33]`:**  \n  Khi Người bán đăng vé, hệ thống gửi mã OTP 6 số về Gmail đã đăng ký tại Ban tổ chức gốc. Chỉ khi nhập đúng OTP (`VerifyOTP`), vé gốc mới bị phong tỏa tại Ban tổ chức và tin đăng chuyển sang hiển thị công khai trên sàn (`Verified`).\n* **Trần giá bán lại & Biểu phí linh hoạt `[00:56, 02:09, 05:35]`:**  \n  - Giá bán không được vượt quá % trần giá cấu hình bởi Admin (`ResalePrice <= CeilingPrice`).\n  - Hệ thống tự động tính biểu phí minh bạch: thu phí nền tảng 3% đối với người bán và phí chuyển đổi vé 5% đối với người mua.\n  - Cho phép người bán chọn chế độ công khai (Marketplace) hoặc riêng tư (Private Link có token).\n* **Đóng sàn tự động trước giờ diễn `[06:13]`:**  \n  Trước giờ bắt đầu sự kiện một khoảng thời gian do Admin cấu hình (mặc định 2 tiếng), sàn tự động ngừng cho phép đặt mua (`EventCutoff`), tin đăng chuyển sang `Expired` và vé gốc được giải phóng về kho BTC.\n\n#### Ma trận Chuyển trạng thái `ResaleListing`\n\n| Trạng thái Nguồn | Sự kiện (Trigger) | Điều kiện rào (Guard) | Hành vi / Tác động tài sản (Action) | Trạng thái Đích |\n| :--- | :--- | :--- | :--- | :--- |\n| **[*]** | `SubmitTicket` | Người bán nhập mã vé lần đầu | Tạo bản ghi nháp `Draft`; phát OTP xác thực về Gmail người bán từ hệ thống BTC. | **Draft** |\n| **Draft** | `VerifyOTP` | OTP hợp lệ & chưa hết hạn | Gọi gRPC khóa vé gốc tại BTC (`LOCKED_FOR_RESALE`); đưa vé lên sàn giao dịch. | **Verified** |\n| **Draft** | `CancelVerification` | Quá hạn OTP hoặc Người bán hủy | Xóa bản ghi nháp; giải phóng tài nguyên. | **Cancelled** |\n| **Verified** | `ReserveTicket` | Người mua bấm thanh toán | Khóa giữ vé tạm thời 10 phút để tránh bán trùng (Double Allocation). | **Transacting** |\n| **Verified** | `CancelListing` | Người bán chủ động gỡ vé (chưa ai giữ chỗ) | Kiểm tra vé an toàn; gọi gRPC mở khóa vé gốc tại BTC. | **Cancelled** |\n| **Verified** | `EventCutoff` | Chạm mốc đóng sàn trước giờ diễn (Admin cấu hình) | Tự động hạ tin khỏi Marketplace; gọi gRPC hoàn vé gốc về cho người bán. | **Expired** |\n| **Transacting** | `ReleaseHold` | Người mua hủy hoặc quá hạn thanh toán 10 phút | Mở khóa vé; đưa vé trở lại trạng thái sẵn sàng bán trên sàn. | **Verified** |\n| **Transacting** | `ConfirmPayment` | Người mua chuyển khoản thành công | Đóng tin niêm yết vĩnh viễn; xác nhận giao dịch thành công. | **Sold** |\n| **Sold / Cancelled / Expired** | **[*]** | Hoàn tất chu trình | Lưu trữ dữ liệu lịch sử; đóng vòng đời tin đăng. | **[*]** |\n\n---\n\n## 3. BA CƠ CHẾ NGUYÊN TỬ ĐẶC BIỆT BẢO VỆ GIAO DỊCH (ATOMIC MECHANISMS)\n\n### 3.1. Chốt chặn Nguyên tử Hai chiều (Bidirectional Atomic CAS)\n- **Vấn đề thực tế:** Nếu đúng thời điểm tiền sắp giải ngân cho Người bán mà Người mua bấm nộp đơn khiếu nại (Race Condition) thì chuyện gì xảy ra?\n- **Giải pháp:** Cơ chế **Compare-And-Swap (CAS)** trực tiếp tại tầng CSDL:\n  - Tiến trình giải ngân: `UPDATE escrow_transactions SET status = 'Releasing' WHERE id = @id AND status = 'Locked';`\n  - Người mua khiếu nại: `UPDATE escrow_transactions SET status = 'Disputed' WHERE id = @id AND status = 'Locked';`\n- **Kết quả:** Vì chạy chung trong một hệ quản trị CSDL chuẩn ACID, chỉ duy nhất 1 câu lệnh thành công (Rows Affected = 1). Nếu khiếu nại xảy ra trước, tiền lập tức bị đóng băng 100%, bảo vệ an toàn tài chính tuyệt đối.\n\n---\n\n### 3.2. Cơ chế Bù trừ Thanh toán Muộn (Late Payment Saga Compensation)\n- **Vấn đề thực tế:** Người mua chuyển khoản ở giây thứ 9 phút 59 giây, nhưng do nghẽn mạng ngân hàng, thông báo thanh toán đến server sau khi phiên giữ vé 10 phút đã hết hạn và vé đã bị người khác mua mất.\n- **Giải pháp:** Áp dụng **Saga Compensation**: Hệ thống kiểm tra thấy vé đã bị giải phóng thì tuyệt đối **không cấp vé trùng**, lập tức chuyển tiền vào hàng đợi hoàn tiền tự động 100% cho người mua trả muộn.\n\n---\n\n### 3.3. Quy tắc Bán trọn gói Combo (Bundle Law All-or-Nothing)\n- **Vấn đề thực tế:** Người bán đăng combo 2 vé liền kề (VIP Cặp đôi). Nếu người bán bấm hủy 1 vé thì xử lý thế nào?\n- **Giải pháp:** Toàn bộ vé trong gói được quản lý nguyên tử theo `BundleId`. Nếu một vé bị hủy, toàn bộ các vé con trong gói đồng thời bị hủy và mở khóa về kho BTC. Triệt tiêu 100% rủi ro sinh ra vé mồ côi làm gãy cấu trúc gói vé.\n\n---\n\n## 4. NĂM CÂU HỎI VÀNG HỘI ĐỒNG SẼ XOÁY VÀO STATE MACHINE & CÁCH TRẢ LỜI\n\n### Câu hỏi 1: Tại sao sơ đồ State Diagram của nhóm vẽ tinh gọn (chỉ có State và Event) mà không nhồi Guard và Action lên hình?\n> **Trả lời:**  \n> *\"Thưa Hội đồng, đây là sự tuân thủ nghiêm ngặt **Nguyên tắc Thiết kế Trừu tượng (Abstract Modeling)** theo đúng định hướng của GVHD:  \n> - Ở cấp độ mô hình hóa phân tích thiết kế, biểu đồ trực quan cần thể hiện rõ ràng và trong sáng nhất vòng đời trạng thái cốt lõi của thực thể, tránh sa đà vào các dòng code logic gây rối mắt và che lấp luồng nghiệp vụ.  \n> - Toàn bộ các điều kiện rào (Guard), hành vi hệ quả (Action) và cơ chế nguyên tử bảo vệ tài sản đều được nhóm đặc tả chi tiết và chuẩn hóa trong Bảng Ma trận Chuyển trạng thái đi kèm.\"*\n\n---\n\n### Câu hỏi 2: Tại sao hệ thống tách làm 2 State Machine riêng (`EscrowTransaction` và `ResaleListing`) mà không gộp chung?\n> **Trả lời:**  \n> *\"Thưa Hội đồng, đây là sự tuân thủ chuẩn mực **UML OMG Specification (1 Classifier = 1 State Machine)** và kiến trúc Bounded Context:  \n> - `ResaleListing` quản lý vòng đời tin đăng bán vé (từ lúc xác thực OTP đến khi bán thành công hoặc hủy).  \n> - `EscrowTransaction` quản lý vòng đời dòng tiền ký quỹ và phân xử đơn hàng.  \n> - Một tin đăng có thể phát sinh nhiều phiên giao dịch giữ chỗ nếu người mua trước quá hạn thanh toán (quan hệ 1 - Nhiều). Việc tách bạch giúp mô hình khớp 1:1 với cấu trúc thực thể trong CSDL PostgreSQL.\"*\n\n---\n\n### Câu hỏi 3: Khoảng thời gian ký quỹ và thời hạn đóng sàn trước giờ diễn được xác định như thế nào?\n> **Trả lời:**  \n> *\"Thưa Hội đồng, như nhóm đã báo cáo tại Review 5 (mốc `[06:13]`):  \n> - Cả thời gian giữ tiền ký quỹ (mặc định 24h) và thời hạn đóng sàn trước giờ diễn sự kiện (mặc định 2 tiếng) đều được thiết kế linh hoạt thông qua bảng cấu hình hệ thống `SystemSettings` trên màn hình Admin Dashboard. Ban quản trị có thể tùy chỉnh tham số này theo đặc thù của từng quy mô sự kiện.\"*\n\n---\n\n### Câu hỏi 4: Khi người mua khiếu nại vé lỗi tại cổng, Admin đối soát dựa trên cơ sở nào để ra phán quyết hoàn tiền hay bác bỏ?\n> **Trả lời:**  \n> *\"Thưa Hội đồng, như đã demo tại Review 5 (mốc `[05:21]` và `[07:35]`):  \n> - Hệ thống không phân xử cảm tính mà tự động tích hợp API tra cứu nhật ký quét vé từ cổng soát vé của Ban tổ chức (Gate Access Logs).  \n> - Nếu log cổng xác nhận vé bị lỗi hoặc chưa từng quét vào cổng, Admin duyệt hoàn tiền 100% cho người mua. Nếu log cổng chứng minh mã vé đã được quét vào cổng thành công (`VALID_ENTRY`), Admin bác bỏ khiếu nại gian lận và bảo vệ tiền cho người bán.\"*\n\n---\n\n### Câu hỏi 5: Hệ thống có cơ chế gì để chế tài người bán cố tình gian lận bán vé giả hoặc vé lỗi?\n> **Trả lời:**  \n> *\"Thưa Hội đồng, theo giải pháp nhóm đã thống nhất tại Review 5 (mốc `[09:13]`):  \n> - Hệ thống áp dụng **Cơ chế Điểm Uy tín Người bán (Reputation Score)**: Mỗi khi bị Admin xử thua trong một vụ khiếu nại, người bán bị trừ điểm uy tín nặng và ghi nhận vi phạm vào lịch sử tài khoản.  \n> - Nếu điểm uy tín rơi xuống dưới ngưỡng cảnh báo, tài khoản người bán sẽ bị hệ thống tạm khóa hoặc cấm vĩnh viễn quyền đăng bán trên sàn.\"*"};

      } else if (tab === 'resale') {
        diagramImage.src = './state/resale_listing.svg';
        diagramImage.alt = 'State Diagram - ResaleListing';
        document.getElementById('activeDocPath').textContent = 'docs/diagrams/state/resale_listing.mmd';
        loadDocs('state');
        // Scroll to Section 1.2 ResaleListing in docsPane
        setTimeout(() => {
          const docsPaneEl = document.getElementById('docsPane');
          if (docsPaneEl) {
            const h3List = Array.from(docsPaneEl.querySelectorAll('h3, h2'));
            const targetH3 = h3List.find(el => el.textContent.includes('ResaleListing'));
            if (targetH3) {
              targetH3.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }
        }, 120);
      }

      resetZoom();
    }

    // Resizable Split Pane Logic for Main Workspace
    let isResizing = false;
    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const containerWidth = document.getElementById('workspace').offsetWidth;
      const newWidth = (e.clientX / containerWidth) * 100;
      if (newWidth > 20 && newWidth < 80) {
        docsPane.style.width = `${newWidth}%`;
      }
    });

    window.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('dragging');
        document.body.style.cursor = 'default';
      }
    });

    // Initial Load
    switchTab('system');
  </script>
</body>
</html>
